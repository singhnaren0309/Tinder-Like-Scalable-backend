version: '3.8'

services:
  # 1. PostgreSQL (ACID relational consistency: Users, Profiles, Matches)
  postgres:
    image: postgres:16-alpine
    container_name: tinder-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tinder_profile_db
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tinder-network

  # 2. Apache Cassandra (High WPS Swiping Data)
  cassandra:
    image: cassandra:4.1
    container_name: tinder-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: TinderCluster
      CASSANDRA_DC: datacenter1
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    networks:
      - tinder-network

  # 3. Redis (Atomic Match Detection, Feed Stacks, Rate Limiting)
  redis:
    image: redis:7-alpine
    container_name: tinder-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - tinder-network

  # 4. Apache Kafka (KRaft mode: CDC and event-driven decoupling)
  kafka:
    image: bashj79/kafka-kraft:latest
    container_name: tinder-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - tinder-network

  # 5. Elasticsearch (Geospatial Feed Search & Distance Sorting)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: tinder-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - tinder-network

  # 6. API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: tinder-api-gateway
    ports:
      - "8080:8080"
    environment:
      - GATEWAY_PORT=8080
      - PROFILE_SERVICE_URL=http://profile-service:8081
      - SWIPE_SERVICE_URL=http://swipe-service:8082
      - NOTIFICATION_SERVICE_URL=http://notification-service:8083
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=tinder_super_secret_jwt_key_scalable_2026
    depends_on:
      - redis
    networks:
      - tinder-network

  # 7. Profile Service
  profile-service:
    build:
      context: .
      dockerfile: Dockerfile.profile
    container_name: tinder-profile-service
    ports:
      - "8081:8081"
    environment:
      - PROFILE_SERVICE_PORT=8081
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tinder_profile_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BROKERS=kafka:29092
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
    depends_on:
      - postgres
      - kafka
      - redis
      - elasticsearch
    networks:
      - tinder-network

  # 8. Swipe Service
  swipe-service:
    build:
      context: .
      dockerfile: Dockerfile.swipe
    container_name: tinder-swipe-service
    ports:
      - "8082:8082"
    environment:
      - SWIPE_SERVICE_PORT=8082
      - CASSANDRA_CONTACT_POINTS=cassandra
      - CASSANDRA_KEYSPACE=tinder_swipe_keyspace
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=tinder_profile_db
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      - cassandra
      - redis
      - postgres
      - kafka
    networks:
      - tinder-network

  # 9. Notification Service
  notification-service:
    build:
      context: .
      dockerfile: Dockerfile.notification
    container_name: tinder-notification-service
    ports:
      - "8083:8083"
    environment:
      - NOTIFICATION_SERVICE_PORT=8083
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      - kafka
    networks:
      - tinder-network

  # 10. Feed Cron Worker
  feed-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: tinder-feed-worker
    environment:
      - POSTGRES_HOST=postgres
      - CASSANDRA_CONTACT_POINTS=cassandra
      - REDIS_HOST=redis
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
    depends_on:
      - postgres
      - cassandra
      - redis
      - elasticsearch
    networks:
      - tinder-network

volumes:
  postgres_data:
  cassandra_data:
  redis_data:
  es_data:

networks:
  tinder-network:
    driver: bridge

